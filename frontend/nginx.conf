server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # assets com hash no nome -> cache agressivo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota desconhecida cai no index.html (React Router resolve)
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
}
