services:
  meuSalchipao:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    ports:
      - ${DB_PORT}:3306
    volumes:
      - meuSalchipao_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      ConnectionStrings__DefaultConnection: "Server=meuSalchipao;Port=3306;Database=${DB_NAME};User=${DB_USER};Password=${DB_USER_PASSWORD};"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - ${API_PORT:-5029}:8080
    depends_on:
      meuSalchipao:
        condition: service_healthy

volumes:
  meuSalchipao_data: {}
